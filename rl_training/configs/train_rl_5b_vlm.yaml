trainer: dancegrpo
# Multi-node VLM-judge training candidate for global process counts 32, 64, and
# 128. Set the generic VLM launcher to DP4 x TP2 per eight-GPU machine through
# WAN_TRAINER_VLM_DATA_PARALLEL_SIZE and WAN_TRAINER_VLM_TENSOR_PARALLEL_SIZE;
# all ranks roll out/train Wan 5B. Override output_dir and wandb_run_name for
# each topology so checkpoints and tracking runs cannot collide.
model_path: storage/models/diffsynth_converted_5b/wan2.2-TI2V-5B_260715_vbvr_pro_step-35500

# Materialize the already-downloaded public raw snapshot once with:
# .venv/bin/python -m scripts.data.vbvr_pro_unpack_hf \
#   --dataset-root storage/datasets/VBVR-Pro-RL \
#   --output-dir storage/datasets/VBVR-Pro-RL/materialized \
#   --source-revision ca0aaffea93b07d269c6fe2fbfe533f1fdab9aa1 \
#   --expected-tasks 50 --expected-samples 50000 --workers 8
dataset_json: storage/datasets/VBVR-Pro-RL/materialized/dataset.json
dataset_size: 50000
num_frames: 81
height: 512
width: 512
fps: 16

# The restored manifest is task-grouped. Shuffle its complete raw index before
# batching so consecutive optimizer steps do not remain inside one task.
shuffle_raw_indices: true
shuffle_raw_indices_seed: 42

output_dir: storage/checkpoints/dancegrpo_vbvr_pro_5b_512x512x81_vlm_qwen36_task_prompts_cps0p7_from_diffsynth_step35500_bs32_lr_5e-6_manifest_rl
resume_from: null
reset_dataloader: null
auto_resume: true

# All-rank GRPO. HSDP creates one eight-rank shard group per machine; there are no
# dedicated rollout-only ranks.
rl_train_node_count: 0
rl_train_rank_count: 0
rl_actor_weight_sync: none
rl_actor_weight_sync_interval: 1
rl_async_rollout: false
rl_async_rollout_prefetch_steps: 0
rl_split_debug_logs: false

# Optimizer and schedule match the 512x512x81 rule-reward config.
batch_size: 32
gradient_accumulation_steps: 1
num_epochs: 5
learning_rate: 5.0e-6
weight_decay: 0.01
max_grad_norm: 1.0
warmup_steps: 5
save_steps: 100
log_steps: 1
seed: 42
ema_decay: 0.0
transformer_load_dtype: float32
gradient_checkpointing: true
use_liger_kernel: true
attention_backend: _flash_3_hub
disable_cudnn_sdp: true
torch_compile: true
torch_compile_backend: inductor
torch_compile_mode: null

num_workers: 2
prefetch_factor: 2
persistent_workers: true

# HSDP uses eight-rank shard groups and adds replicas as the world grows.
fsdp: true
expert_parallel: false
hsdp: true
train_experts: both
lora_rank: 0
lora_alpha: 32

# Two 16-prompt waves preserve 32 global prompts. The ranks assigned to each
# prompt must divide G=32; per-rank rollout ownership follows from that ratio.
grpo_shared_prompt_batch: true
grpo_shared_prompt_microbatch_size: 16

# Retain the one-update-delayed pipeline so next-step VLM requests can
# overlap replay. Qwen shares these GPUs, so the first run must monitor whether
# simultaneous vLLM DP/TP and HSDP collectives reduce throughput or stability.
grpo_delayed_replay: true
grpo_delayed_replay_clip_range: 1.0e-2
grpo_group_size: 32

# Cap rollout/replay and VAE decode chunks at four to leave headroom for the
# co-hosted service. The number of chunks follows the per-rank rollout count.
grpo_sample_batch_size: 4
grpo_train_sample_batch_size: 4
grpo_fsdp_sync_each_backward: true
grpo_offload_inference_models: true
grpo_num_sampling_steps: 30
grpo_clip_range: 1.0e-4
grpo_kl_coeff: 0
grpo_reward_fn: vbvr_vlm
grpo_sde_formula: flowcps
grpo_sde_noise_scale: 0.7
grpo_cfg_scale: 1.0
dancegrpo_share_group_init_noise: true
dancegrpo_timestep_selection_ratio: 0.6

# The launcher overrides endpoint/model/key from WAN_TRAINER_VLM_* so every
# node's training ranks address that node's loopback DP4 x TP2 service.
vlm_reward_base_url: http://127.0.0.1:18080/v1
vlm_reward_model: qwen3.6-27b
vlm_reward_api_key: EMPTY
vlm_reward_prompt_mode: task_specific
vlm_reward_video_fps: 16
vlm_reward_video_num_frames: 32
vlm_reward_include_gt_first_frame: true
vlm_reward_decode_batch_size: 4

# Two request workers per training rank give 16 concurrent requests per node,
# within the service default max_num_seqs=32. Keep at most 16 decoded 512
# videos (~0.98 GiB) pending per rank.
vlm_reward_concurrency: 2
vlm_reward_max_pending_jobs: 16
vlm_reward_request_timeout_seconds: 300
vlm_reward_max_retries: 2
vlm_reward_retry_backoff_seconds: 1
vlm_reward_max_new_tokens: 1024
# Generated 512 frames are evaluated at native resolution. This is a
# downscale-only safety bound, so neither 384 nor 512 inputs are enlarged to
# the separate rule scorer's 1024x1024 preparation size.
vlm_reward_image_max_edge: 512
vlm_reward_jpeg_quality: 85
vlm_reward_score_max: 100
vlm_reward_use_structured_output: false
vlm_reward_validate_service: true
# Keep the distributed optimizer alive if a runtime judge request or response
# fails after retries; only the affected rollout receives reward zero.
vlm_reward_fail_on_error: false
vlm_reward_error_score: 0
vlm_reward_log_first_n: 2

wandb_project: wan-dancegrpo-vbvr-pro-5b
wandb_run_name: dancegrpo_vbvr_pro_5b_512x512x81_vlm_qwen36_task_prompts_cps0p7_from_diffsynth_step35500_bs32_lr_5e-6_manifest_rl
